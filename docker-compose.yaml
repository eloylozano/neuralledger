version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/storage:/app/storage
    environment:
      - DATABASE_URL=sqlite:///./neuralledger.db
    # Si usas Ollama en tu host local (fuera de Docker):
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Más adelante añadiremos aquí el servicio 'frontend'