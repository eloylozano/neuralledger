version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: neuralledger-db
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DB=neuralledger
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: neuralledger-backend
    restart: on-failure
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/storage:/app/storage
    environment:
      - DATABASE_URL=postgresql://admin:admin123@db:5432/neuralledger
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db